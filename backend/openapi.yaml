    ValidationError:
      description: Request was syntactically valid but semantically invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            link_auth_assignment_required:
              summary: LinkAuthAssignmentRequiredError
              value:
                code: LINK_ASSIGNED_PARTICIPANT_REQUIRED
                message: Links that require authentication must be assigned to a participant.
            link_no_recipient:
              summary: LinkNoRecipientError
              value:
                code: LINK_NO_RECIPIENT
                message: Cannot send email for a link without an assigned participant.
            private_survey_assigned_email_required:
              summary: PrivateSurveyAssignedEmailRequiredError
              value:
                code: ASSIGNED_PARTICIPANT_REQUIRED
                message: Private surveys require links assigned to a participant.
            survey_visibility_mismatch:
              summary: SurveyVisibilityMismatchError
              value:
                code: SURVEY_VISIBILITY_MISMATCH
                message: <example>
            pydantic_field_validation:
              summary: Pydantic field validation failure
              value:
                code: VALIDATION_ERROR
                message: Request validation failed.
                details:
                  errors:
                  - message: Unable to extract tag using discriminator 'node_type'
                    type: union_tag_not_found
    RateLimitError:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            email_rate_limit:
              summary: EmailRateLimitError
              value:
                code: EMAIL_RATE_LIMIT_EXCEEDED
                message: Email rate limit exceeded.
            rate_limit_exceeded:
              summary: RateLimitExceededError
              value:
                code: RATE_LIMIT_EXCEEDED
                message: Rate limit exceeded. Please retry after some time.
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unhandled_db_integrity:
              summary: UnhandledDbIntegrityError
              value:
                code: UNHANDLED_DB_INTEGRITY_ERROR
                message: An unexpected database integrity error occurred.
                details:
                  constraint_name: <example>
                  error_key: <example>
            subject_resolution:
              summary: SubjectResolutionError
              value:
                code: SUBJECT_RESOLUTION_FAILED
                message: A referenced respondent subject could not be resolved.
            session_start:
              summary: SessionStartError
              value:
                code: SESSION_START_FAILED
                message: Session start failed.
            envelope_not_found:
              summary: EnvelopeNotFoundError
              value:
                code: ENVELOPE_NOT_FOUND
                message: Response envelope not found.
            answer_save:
              summary: AnswerSaveError
              value:
                code: ANSWER_SAVE_FAILED
                message: Answer save failed.
            email_config:
              summary: EmailConfigError
              value:
                code: EMAIL_CONFIG_ERROR
                message: Email service configuration error.
            email_template_not_found:
              summary: EmailTemplateNotFoundError
              value:
                code: EMAIL_RENDER_ERROR
                message: Email template not found.
            email_render:
              summary: EmailRenderError
              value:
                code: EMAIL_RENDER_ERROR
                message: Failed to render email template.
            linkage_key:
              summary: LinkageKeyError
              value:
                code: LINKAGE_KEY_ERROR
                message: <example>
            payload_decode:
              summary: PayloadDecodeError
              value:
                code: PAYLOAD_DECODE_ERROR
                message: Invalid plaintext payload
            uq_project_invitations_token_hash:
              summary: 'DB rule: INVITATION_TOKEN_COLLISION'
              value:
                code: INVITATION_TOKEN_COLLISION
                message: Invitation token collision — retry the request.
            ck_project_invitations_status_valid:
              summary: 'DB rule: INVITATION_STATE_INVALID'
              value:
                code: INVITATION_STATE_INVALID
                message: 'Server invariant violated: a project invitation was written with invalid status=''<status>''.'
            ck_survey_versions_published_requires_timestamp:
              summary: 'DB rule: VERSION_PUBLISH_STATE_INVALID'
              value:
                code: VERSION_PUBLISH_STATE_INVALID
                message: 'Server invariant violated: a survey version reached status=''published'' without published_at. This
                  indicates a code path bypassed surveys_repo.publish_version.'
            ck_submission_sessions_session_status_valid:
              summary: 'DB rule: SESSION_STATE_INVALID'
              value:
                code: SESSION_STATE_INVALID
                message: 'Server invariant violated: a submission session was written with invalid session_status=''<session_status>''.
                  session_status is server-controlled and must be one of ''in_progress'', ''completed'', ''abandoned''.'
            ck_submission_sessions_completed_at_consistent:
              summary: 'DB rule: SESSION_COMPLETION_STATE_INVALID'
              value:
                code: SESSION_COMPLETION_STATE_INVALID
                message: 'Server invariant violated: a submission session has an inconsistent completed_at for its session_status.'
            ck_submission_events_event_type_valid:
              summary: 'DB rule: EVENT_TYPE_INVALID'
              value:
                code: EVENT_TYPE_INVALID
                message: 'Server invariant violated: a submission event was written with invalid event_type=''<event_type>''.'
            ck_survey_encryption_keys_wrapped_key_len:
              summary: 'DB rule: SURVEY_ENCRYPTION_KEY_INVALID'
