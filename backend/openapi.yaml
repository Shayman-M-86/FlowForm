            ck_survey_encryption_keys_kms_context_version_valid:
              summary: 'DB rule: SURVEY_ENCRYPTION_KEY_INVALID'
              value:
                code: SURVEY_ENCRYPTION_KEY_INVALID
                message: 'Server invariant violated: a survey encryption key was written with invalid kms_context_version=''<kms_context_version>''.'
            ck_project_memberships_status_valid:
              summary: 'DB rule: MEMBERSHIP_STATE_INVALID'
              value:
                code: MEMBERSHIP_STATE_INVALID
                message: 'Server invariant violated: a project membership was written with invalid status=''<status>''.'
            internal_server_error:
              summary: Generic server error
              value:
                code: INTERNAL_SERVER_ERROR
                message: An unexpected error occurred.
