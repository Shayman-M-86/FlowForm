components:
  schemas:
    ErrorCode:
      description: Machine-readable error code
      type: string
    ErrorDetails:
      additionalProperties: true
      type: object
    ErrorMessage:
      description: Human-readable error message
      type: string
    ErrorPayload:
      description: Wire envelope shared by runtime error handlers and OpenAPI.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
        details:
          $ref: '#/components/schemas/ErrorDetails'
      required:
      - code
      - message
      title: ErrorPayload
      type: object
    ErrorResponse:
      $ref: '#/components/schemas/ErrorPayload'
      title: ErrorResponse
    IdentityToken:
      maxLength: 8192
      minLength: 1
      type: string
    BootstrapUserRequest:
      additionalProperties: false
      description: Request body for post-auth user bootstrap.
      properties:
        id_token:
          $ref: '#/components/schemas/IdentityToken'
      required:
      - id_token
      title: BootstrapUserRequest
      type: object
    Auth0UserId:
      description: Opaque external Auth0 subject; distinct from the internal user ID
      maxLength: 255
      minLength: 1
      type: string
    CurrentUserResponses:
      description: API response shape for a bootstrapped user.
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        auth0_user_id:
          $ref: '#/components/schemas/Auth0UserId'
        email:
          $ref: '#/components/schemas/EmailAddress'
        display_name:
          anyOf:
          - $ref: '#/components/schemas/ProfileName'
          - type: 'null'
      required:
      - id
      - auth0_user_id
      - email
      - display_name
      title: CurrentUserResponses
      type: object
    EmailAddress:
      format: email
      maxLength: 254
      type: string
    ProfileName:
      maxLength: 100
      minLength: 1
      type: string
    ProjectId:
      description: Project identity
      maximum: 9223372036854775807
      minimum: 1
      type: integer
    ProjectName:
      maxLength: 100
      minLength: 1
      type: string
    ProjectResponses:
      description: API response shape for a project.
      properties:
        id:
          $ref: '#/components/schemas/ProjectId'
        name:
          $ref: '#/components/schemas/ProjectName'
        slug:
          $ref: '#/components/schemas/Slug'
        created_by_user_id:
          anyOf:
          - $ref: '#/components/schemas/UserId'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - name
      - slug
      - created_by_user_id
      - created_at
      title: ProjectResponses
      type: object
    Slug:
      maxLength: 80
      minLength: 1
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      type: string
    Timestamp:
      description: Recorded timestamp supplied by the owning operation
      format: date-time
      type: string
    UserId:
      description: Internal users.id database identity
      maximum: 9223372036854775807
      minimum: 1
      type: integer
    BootstrapUserResponses:
      description: API response shape for a bootstrap-user request.
      properties:
        created:
          title: Created
          type: boolean
        user:
          $ref: '#/components/schemas/CurrentUserResponses'
        default_project:
          anyOf:
          - $ref: '#/components/schemas/ProjectResponses'
          - type: 'null'
          default: null
      required:
      - created
      - user
      title: BootstrapUserResponses
      type: object
    InvitationMessage:
      maxLength: 500
      minLength: 1
      type: string
    ProjectInvitationId:
      description: Project invitation identity
      maximum: 9223372036854775807
      minimum: 1
      type: integer
    ProjectInvitationResponses:
      description: API response shape for a project invitation.
      properties:
        id:
          $ref: '#/components/schemas/ProjectInvitationId'
        project_id:
          $ref: '#/components/schemas/ProjectId'
        project_name:
          anyOf:
          - $ref: '#/components/schemas/ProjectName'
          - type: 'null'
          default: null
        invited_email:
          $ref: '#/components/schemas/EmailAddress'
        invite_message:
          anyOf:
          - $ref: '#/components/schemas/InvitationMessage'
          - type: 'null'
          default: null
        invited_by_user_id:
          anyOf:
          - $ref: '#/components/schemas/UserId'
          - type: 'null'
        invited_by_display:
          anyOf:
          - $ref: '#/components/schemas/Text'
          - type: 'null'
          default: null
        role_id:
          anyOf:
          - $ref: '#/components/schemas/ProjectRoleId'
          - type: 'null'
        status:
          enum:
          - pending
          - accepted
          - declined
          - revoked
          title: Status
          type: string
        expires_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        accepted_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - project_id
      - invited_email
      - invited_by_user_id
      - role_id
      - status
      - expires_at
      - accepted_at
      - created_at
      title: ProjectInvitationResponses
      type: object
    ProjectRoleId:
      description: Project role identity
      maximum: 9223372036854775807
      minimum: 1
      type: integer
    Text:
      maxLength: 2000
      type: string
    MemberUserResponses:
      description: Embedded user details on a project member response.
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        email:
          $ref: '#/components/schemas/EmailAddress'
        display_name:
          anyOf:
          - $ref: '#/components/schemas/ProfileName'
          - type: 'null'
      required:
      - id
      - email
      - display_name
      title: MemberUserResponses
      type: object
    ProjectMembershipId:
      description: Project membership identity
      maximum: 9223372036854775807
      minimum: 1
      type: integer
    ProjectMemberResponses:
      description: API response shape for a project membership.
      properties:
        id:
          $ref: '#/components/schemas/ProjectMembershipId'
        user_id:
          $ref: '#/components/schemas/UserId'
        project_id:
          $ref: '#/components/schemas/ProjectId'
        role_id:
          anyOf:
          - $ref: '#/components/schemas/ProjectRoleId'
          - type: 'null'
        status:
          enum:
          - active
          - suspended
          title: Status
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        user:
          $ref: '#/components/schemas/MemberUserResponses'
      required:
      - id
      - user_id
      - project_id
      - role_id
      - status
      - created_at
      - user
      title: ProjectMemberResponses
      type: object
    PublicInvitationResolveResponse:
      description: Public-facing response when resolving an invitation token.
      properties:
        invited_email:
          $ref: '#/components/schemas/EmailAddress'
        project_name:
          $ref: '#/components/schemas/ProjectName'
        inviter_name:
          anyOf:
          - $ref: '#/components/schemas/Text'
          - type: 'null'
          default: null
        expires_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          default: null
        status:
          enum:
          - pending
          - accepted
