                message: 'Server invariant violated: a survey encryption key was written without wrapped key material.'
            ck_survey_encryption_keys_kms_key_arn_len:
              summary: 'DB rule: SURVEY_ENCRYPTION_KEY_INVALID'
              value:
                code: SURVEY_ENCRYPTION_KEY_INVALID
