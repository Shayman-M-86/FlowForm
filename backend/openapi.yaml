openapi: 3.1.1
info:
  description: REST API for the FlowForm survey platform.
  contact:
    name: FlowForm Support
    email: support@flow-form.com.au
  title: FlowForm API
  version: 0.1.0
servers:
- url: http://localhost:5000
  description: Local development
security:
- BearerAuth: []
tags:
- name: Account
- name: Account Invitations
- name: Auth
- name: Health
- name: Participants
- name: Project Invitations
- name: Project Members
- name: Projects
- name: Respondent Links
- name: Respondent Submission Sessions
