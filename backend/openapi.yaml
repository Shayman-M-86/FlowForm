          examples:
            BadRequest:
              summary: Bad Request
              value:
                code: HTTP_400
                message: The browser (or proxy) sent a request that this server could not understand.
    UnauthorizedError:
      description: Authentication required or token invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Unauthorized:
              summary: Unauthorized
              value:
                code: HTTP_401
                message: The server could not verify that you are authorized to access the URL requested. You either supplied
                  the wrong credentials (e.g. a bad password), or your browser doesn't understand how to supply the credentials
                  required.
    ForbiddenError:
      description: Authenticated but not authorized for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Forbidden:
              summary: Forbidden
              value:
                code: HTTP_403
                message: You don't have the permission to access the requested resource. It is either read-protected or not
                  readable by the server.
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            NotFound:
              summary: Not Found
              value:
                code: HTTP_404
                message: The requested URL was not found on the server. If you entered the URL manually please check your
                  spelling and try again.
    MethodNotAllowedError:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            MethodNotAllowed:
              summary: Method Not Allowed
              value:
                code: HTTP_405
                message: The method is not allowed for the requested URL.
    ConflictError:
      description: Conflict with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Conflict:
              summary: Conflict
              value:
                code: HTTP_409
                message: A conflict happened while processing the request. The resource might have been modified while the
                  request was being processed.
    RequestEntityTooLargeError:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            RequestEntityTooLarge:
              summary: Request Entity Too Large
              value:
                code: HTTP_413
