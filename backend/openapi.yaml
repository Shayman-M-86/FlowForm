    SurveyField:
      additionalProperties: false
      description: 'A question: its prompt, how it is answered, and what it stores.


        ``id`` is the answer-storage identity; ``key`` names the column in exported results.

        Interaction and response remain separate unions. A small validator enforces their

        compatibility without multiplying the model count into one class per pairing.'
      properties:
        id:
          maxLength: 128
          minLength: 6
          pattern: ^field_[A-Za-z0-9_]+$
          title: Id
          type: string
        key:
          pattern: ^[a-z0-9_]{1,64}$
          title: Key
          type: string
        prompt:
          maxLength: 1000
          minLength: 1
          title: Prompt
          type: string
        description:
          default: ''
          maxLength: 5000
          title: Description
          type: string
        helpText:
          default: ''
          maxLength: 1000
          title: Helptext
          type: string
        interaction:
          discriminator:
            mapping:
              date: '#/components/schemas/DateInteraction'
              long_text: '#/components/schemas/LongTextInteraction'
              multiple_choice: '#/components/schemas/MultipleChoiceInteraction'
              number: '#/components/schemas/NumberInteraction'
              rating: '#/components/schemas/RatingInteraction'
              single_choice: '#/components/schemas/SingleChoiceInteraction'
              slider: '#/components/schemas/SliderInteraction'
              text: '#/components/schemas/TextInteraction'
            propertyName: kind
          oneOf:
          - $ref: '#/components/schemas/TextInteraction'
          - $ref: '#/components/schemas/LongTextInteraction'
          - $ref: '#/components/schemas/NumberInteraction'
          - $ref: '#/components/schemas/SingleChoiceInteraction'
          - $ref: '#/components/schemas/MultipleChoiceInteraction'
          - $ref: '#/components/schemas/RatingInteraction'
          - $ref: '#/components/schemas/SliderInteraction'
          - $ref: '#/components/schemas/DateInteraction'
          title: Interaction
        response:
          discriminator:
            mapping:
              choice: '#/components/schemas/ChoiceResponse'
              choice_set: '#/components/schemas/ChoiceSetResponse'
              date: '#/components/schemas/DateResponse'
              decimal: '#/components/schemas/DecimalResponse'
              integer: '#/components/schemas/IntegerResponse'
              string: '#/components/schemas/StringResponse'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/StringResponse'
          - $ref: '#/components/schemas/IntegerResponse'
          - $ref: '#/components/schemas/DecimalResponse'
          - $ref: '#/components/schemas/DateResponse'
          - $ref: '#/components/schemas/ChoiceResponse'
          - $ref: '#/components/schemas/ChoiceSetResponse'
          title: Response
        behaviour:
          $ref: '#/components/schemas/FieldBehaviour'
