components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          maxLength: 128
        message:
          type: string
          description: Human-readable error message.
          maxLength: 1000
        details:
          type: object
          description: Optional structured extras. Pydantic validation errors place their per-field failures here as ``details.errors``.
          additionalProperties: true
    BootstrapUserRequest:
      description: Request body for post-auth user bootstrap.
      properties:
        id_token:
          maxLength: 8192
          minLength: 1
          title: Id Token
          type: string
      required:
      - id_token
      title: BootstrapUserRequest
      type: object
    CurrentUserResponses:
      description: API response shape for a bootstrapped user.
      properties:
        id:
          title: Id
          type: integer
        auth0_user_id:
          title: Auth0 User Id
          type: string
          maxLength: 255
        email:
          title: Email
          type: string
          maxLength: 254
        display_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Display Name
      required:
      - id
      - auth0_user_id
      - email
      - display_name
      title: CurrentUserResponses
      type: object
    ProjectResponses:
      description: API response shape for a project.
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
          maxLength: 100
        slug:
          title: Slug
          type: string
          maxLength: 80
        created_by_user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Created By User Id
        created_at:
          format: date-time
          title: Created At
          type: string
          maxLength: 35
      required:
      - id
      - name
      - slug
      - created_by_user_id
      - created_at
      title: ProjectResponses
      type: object
    BootstrapUserResponses:
      description: API response shape for a bootstrap-user request.
      properties:
        created:
          title: Created
          type: boolean
        user:
          $ref: '#/components/schemas/CurrentUserResponses'
        default_project:
          anyOf:
          - $ref: '#/components/schemas/ProjectResponses'
          - type: 'null'
          default: null
      required:
      - created
      - user
      title: BootstrapUserResponses
      type: object
    ProjectInvitationResponses:
      description: API response shape for a project invitation.
      properties:
        id:
          title: Id
          type: integer
        project_id:
          title: Project Id
          type: integer
        project_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Project Name
        invited_email:
          maxLength: 254
          title: Invited Email
          type: string
        invite_message:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
          title: Invite Message
        invited_by_user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Invited By User Id
        invited_by_display:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Invited By Display
        role_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Role Id
        status:
          enum:
          - pending
          - accepted
          - declined
          - revoked
          maxLength: 8
          title: Status
          type: string
        expires_at:
          anyOf:
          - format: date-time
            type: string
            maxLength: 35
          - type: 'null'
          title: Expires At
        accepted_at:
          anyOf:
          - format: date-time
            type: string
            maxLength: 35
          - type: 'null'
          title: Accepted At
        created_at:
          format: date-time
          title: Created At
          type: string
          maxLength: 35
      required:
      - id
      - project_id
      - invited_email
      - invited_by_user_id
      - role_id
      - status
      - expires_at
      - accepted_at
      - created_at
      title: ProjectInvitationResponses
      type: object
    MemberUserResponses:
      description: Embedded user details on a project member response.
      properties:
        id:
          title: Id
          type: integer
        email:
          title: Email
          type: string
          maxLength: 254
        display_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Display Name
      required:
      - id
      - email
      - display_name
      title: MemberUserResponses
      type: object
    ProjectMemberResponses:
      description: API response shape for a project membership.
      properties:
        id:
          title: Id
          type: integer
        user_id:
          title: User Id
          type: integer
        project_id:
          title: Project Id
          type: integer
        role_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Role Id
        status:
          enum:
          - active
          - suspended
          maxLength: 9
          title: Status
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
          maxLength: 35
        user:
          $ref: '#/components/schemas/MemberUserResponses'
      required:
      - id
      - user_id
      - project_id
      - role_id
      - status
      - created_at
      - user
      title: ProjectMemberResponses
      type: object
    PublicInvitationResolveResponse:
      description: Public-facing response when resolving an invitation token.
      properties:
        invited_email:
          title: Invited Email
          type: string
        project_name:
          title: Project Name
          type: string
        inviter_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Inviter Name
        expires_at:
          anyOf:
          - format: date-time
            type: string
            maxLength: 35
          - type: 'null'
          default: null
          title: Expires At
        status:
          enum:
          - pending
          - accepted
          - declined
          - revoked
          title: Status
          type: string
          maxLength: 8
      required:
      - invited_email
      - project_name
      - status
      title: PublicInvitationResolveResponse
      type: object
    CurrentUserProfileResponses:
      description: API response shape for the current user's profile.
      properties:
        id:
          title: Id
          type: integer
        auth0_user_id:
          title: Auth0 User Id
          type: string
          maxLength: 255
        email:
          title: Email
          type: string
          maxLength: 254
        display_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Display Name
        email_verified:
          title: Email Verified
          type: boolean
      required:
      - id
      - auth0_user_id
      - email
      - display_name
      - email_verified
      title: CurrentUserProfileResponses
      type: object
    UpdateProfileRequest:
      description: Update display name, nickname, and/or profile picture.
      properties:
        display_name:
          anyOf:
          - maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Display Name
        nickname:
          anyOf:
          - maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Nickname
        picture:
          anyOf:
          - maxLength: 2048
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Picture
      title: UpdateProfileRequest
      type: object
    ChangeEmailRequest:
      description: Request body for changing the account email address.
      properties:
        email:
          maxLength: 254
          minLength: 1
          title: Email
          type: string
      required:
      - email
      title: ChangeEmailRequest
      type: object
    ChangeUsernameRequest:
      description: Request body for changing the Auth0 username.
      properties:
        username:
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z0-9_.\-]+$
          title: Username
          type: string
      required:
      - username
      title: ChangeUsernameRequest
      type: object
    PasswordChangeTicketResponses:
      description: Hosted Auth0 password-change ticket URL.
      properties:
        ticket_url:
          maxLength: 2048
          title: Ticket Url
          type: string
      required:
      - ticket_url
      title: PasswordChangeTicketResponses
      type: object
    EmailVerificationCheckResponses:
      description: Result of a live, on-demand email verification check against Auth0.
      properties:
        email_verified:
          title: Email Verified
          type: boolean
      required:
      - email_verified
      title: EmailVerificationCheckResponses
      type: object
    ResolveSurveyAccessLinkTokenRequest:
      description: Request body for resolving a respondent survey access link token.
      properties:
        token:
          maxLength: 256
          minLength: 1
          title: Token
          type: string
      required:
      - token
      title: ResolveSurveyAccessLinkTokenRequest
      type: object
    AlwaysVisible:
      additionalProperties: false
      description: The field is always shown.
      properties:
        mode:
          const: always
          title: Mode
          type: string
          maxLength: 6
      required:
      - mode
      title: AlwaysVisible
      type: object
    ChoiceOption:
      additionalProperties: false
      description: One selectable option. The id is what an answer stores.
      properties:
        id:
          maxLength: 128
          minLength: 7
          pattern: ^option_[A-Za-z0-9_]+$
          title: Id
          type: string
        label:
          maxLength: 1000
          minLength: 1
          title: Label
          type: string
      required:
      - id
      - label
      title: ChoiceOption
      type: object
    ChoiceResponse:
      additionalProperties: false
      description: Stores a single selected option id.
      properties:
        type:
          const: choice
          title: Type
          type: string
          maxLength: 6
        required:
          default: false
          title: Required
          type: boolean
      required:
      - type
      title: ChoiceResponse
      type: object
    ChoiceSetResponse:
      additionalProperties: false
      description: Stores zero or more selected option ids.
      properties:
        type:
          const: choice_set
          title: Type
          type: string
          maxLength: 10
        required:
          default: false
          title: Required
          type: boolean
        validation:
          anyOf:
          - $ref: '#/components/schemas/ChoiceSetValidation'
          - type: 'null'
          default: null
      required:
      - type
      title: ChoiceSetResponse
      type: object
    ChoiceSetValidation:
      additionalProperties: false
      description: Selection-count bounds for a multi-select answer.
      properties:
        minSelections:
          anyOf:
          - maximum: 200
            minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Minselections
        maxSelections:
          anyOf:
          - maximum: 200
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Maxselections
      title: ChoiceSetValidation
      type: object
    ConditionalVisibility:
      additionalProperties: false
      description: The field is shown only when its condition holds.
      properties:
        mode:
          const: conditional
          title: Mode
          type: string
          maxLength: 11
        condition:
