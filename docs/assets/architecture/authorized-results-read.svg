<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">Authorized results read</title><desc id="d">A Studio request with relevant survey permission uses core metadata to derive locators, fetches encrypted response data, and decrypts only when answer values are requested.</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.b{font-size:16px;font-weight:700}.s{font-size:13px;fill:#46536b}.x{stroke:#53647f;stroke-width:3;marker-end:url(#a)}rect{stroke-width:2;rx:14}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53647f"/></marker></defs><rect width="1100" height="300" fill="#f8fafc" stroke="none"/><text x="45" y="52" class="h">Authorized results read and optional decryption</text><g text-anchor="middle"><rect x="45" y="125" width="195" height="75" fill="#ede9fe" stroke="#7c3aed"/><text x="142" y="157" class="b">Studio permission</text><text x="142" y="180" class="s">relevant survey access</text><rect x="290" y="125" width="195" height="75" fill="#e0e7ff" stroke="#4f46e5"/><text x="387" y="157" class="b">Core metadata</text><text x="387" y="180" class="s">sessions, slots, questions</text><rect x="535" y="125" width="195" height="75" fill="#fce7f3" stroke="#db2777"/><text x="632" y="157" class="b">Response data</text><text x="632" y="180" class="s">envelope + ciphertext</text><rect x="780" y="125" width="275" height="75" fill="#dcfce7" stroke="#16a34a"/><text x="917" y="157" class="b">Result or export</text><text x="917" y="180" class="s">decrypt only when values requested</text></g><g class="x" fill="none"><path d="M240 162H290"/><path d="M485 162H535"/><path d="M730 162H780"/></g></svg>
