<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">AWS network topology</title><desc id="d">The public proxy subnet is the only subnet with a default internet route. The isolated application host uses Squid for controlled egress and connects to RDS and the S3 gateway endpoint through restricted paths.</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.b{font-size:18px;font-weight:700}.s{font-size:14px;fill:#46536b}.x{stroke:#53647f;stroke-width:3;marker-end:url(#a)}rect{stroke-width:2;rx:14}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53647f"/></marker></defs><rect width="1200" height="480" fill="#f8fafc" stroke="none"/><text x="55" y="55" class="h">AWS split-host VPC network topology</text><rect x="45" y="90" width="1110" height="335" fill="#eff6ff" stroke="#2563eb"/><text x="70" y="120" class="b">VPC 10.42.0.0/16</text><g text-anchor="middle"><rect x="90" y="155" width="280" height="190" fill="#dbeafe" stroke="#0284c7"/><text x="230" y="190" class="b">Public proxy subnet</text><text x="230" y="215" class="s">10.42.0.0/24 · AZ A</text><rect x="135" y="250" width="190" height="55" fill="#fff" stroke="#0284c7"/><text x="230" y="284" class="b">Caddy + Squid</text><rect x="445" y="155" width="280" height="190" fill="#ecfdf5" stroke="#16a34a"/><text x="585" y="190" class="b">Isolated app subnet</text><text x="585" y="215" class="s">10.42.1.0/24 · no public IP</text><rect x="490" y="250" width="190" height="55" fill="#fff" stroke="#16a34a"/><text x="585" y="284" class="b">Application host</text><rect x="800" y="155" width="290" height="80" fill="#fef3c7" stroke="#d97706"/><text x="945" y="190" class="b">RDS isolated subnets</text><text x="945" y="215" class="s">10.42.2.0/24 + 10.42.3.0/24</text><rect x="800" y="270" width="290" height="55" fill="#ede9fe" stroke="#7c3aed"/><text x="945" y="303" class="b">S3 gateway endpoint</text></g><g class="x" fill="none"><path d="M445 278H325"/><path d="M725 278H765V195H800"/><path d="M725 295H765V298H800"/><path d="M230 305V445"/></g><text x="50" y="460" class="s">Only the proxy subnet routes 0.0.0.0/0 to the Internet Gateway. Application egress uses Squid; S3 gateway access is limited to ECR layers.</text></svg>
