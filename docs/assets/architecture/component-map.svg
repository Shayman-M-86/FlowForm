<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">FlowForm component map</title><desc id="d">Public Site and Studio use shared packages. Studio and Auth0 connect to the Backend API, which coordinates core and encrypted response stores.</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.b{font-size:18px;font-weight:700}.s{font-size:14px;fill:#46536b}.x{stroke:#53647f;stroke-width:3;marker-end:url(#a)}rect{stroke-width:2;rx:14}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53647f"/></marker></defs><rect width="1200" height="440" fill="#f8fafc" stroke="none"/><text x="55" y="55" class="h">Logical component map</text><g text-anchor="middle"><rect x="60" y="130" width="190" height="80" fill="#e0f2fe" stroke="#0284c7"/><text x="155" y="168" class="b">Public Site</text><text x="155" y="193" class="s">respondent experience</text><rect x="60" y="280" width="190" height="80" fill="#ede9fe" stroke="#7c3aed"/><text x="155" y="318" class="b">Studio</text><text x="155" y="343" class="s">management experience</text><rect x="380" y="205" width="220" height="80" fill="#dcfce7" stroke="#16a34a"/><text x="490" y="243" class="b">Shared packages</text><text x="490" y="268" class="s">UI, schema, builder</text><rect x="720" y="100" width="190" height="80" fill="#fef3c7" stroke="#d97706"/><text x="815" y="138" class="b">Auth0</text><text x="815" y="163" class="s">identity provider</text><rect x="720" y="260" width="190" height="80" fill="#fee2e2" stroke="#dc2626"/><text x="815" y="298" class="b">Backend API</text><text x="815" y="323" class="s">policy + coordination</text><rect x="1010" y="200" width="140" height="65" fill="#e0e7ff" stroke="#4f46e5"/><text x="1080" y="230" class="b">Core store</text><text x="1080" y="251" class="s">metadata</text><rect x="1010" y="315" width="140" height="65" fill="#fce7f3" stroke="#db2777"/><text x="1080" y="345" class="b">Response store</text><text x="1080" y="366" class="s">encrypted data</text></g><g class="x" fill="none"><path d="M250 170H315V245H380"/><path d="M250 320H315V245H380"/><path d="M155 360V390H675V300H720"/><path d="M815 180V260"/><path d="M910 300H960V232H1010"/><path d="M910 320H960V347H1010"/></g></svg>
