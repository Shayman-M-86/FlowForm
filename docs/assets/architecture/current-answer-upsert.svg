<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">Current encrypted answer upsert</title><desc id="d">A valid answer for a question in the frozen survey version is encrypted with a fresh nonce and upserts one current row by opaque answer locator.</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.b{font-size:16px;font-weight:700}.s{font-size:13px;fill:#46536b}.x{stroke:#53647f;stroke-width:3;marker-end:url(#a)}rect{stroke-width:2;rx:14}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53647f"/></marker></defs><rect width="1100" height="300" fill="#f8fafc" stroke="none"/><text x="45" y="52" class="h">One current encrypted row per answer locator</text><g text-anchor="middle"><rect x="45" y="125" width="195" height="75" fill="#e0e7ff" stroke="#4f46e5"/><text x="142" y="157" class="b">Frozen-version check</text><text x="142" y="180" class="s">question belongs to session</text><rect x="290" y="125" width="195" height="75" fill="#e0f2fe" stroke="#0284c7"/><text x="387" y="157" class="b">Schema validation</text><text x="387" y="180" class="s">or encrypted cleared state</text><rect x="535" y="125" width="195" height="75" fill="#fef3c7" stroke="#d97706"/><text x="632" y="157" class="b">Encrypt new state</text><text x="632" y="180" class="s">fresh nonce + associated data</text><rect x="780" y="125" width="275" height="75" fill="#fce7f3" stroke="#db2777"/><text x="917" y="157" class="b">Upsert by answer locator</text><text x="917" y="180" class="s">previous ciphertext is replaced</text></g><g class="x" fill="none"><path d="M240 162H290"/><path d="M485 162H535"/><path d="M730 162H780"/></g></svg>
