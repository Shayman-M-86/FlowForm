<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t d"><title id="t">Respondent access and continuity</title><desc id="d">Survey reachability and respondent continuity are resolved separately before a submission session is created.</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:15px;fill:#46536b}.x{stroke:#53647f;stroke-width:3;marker-end:url(#a)}rect{stroke-width:2;rx:15}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53647f"/></marker></defs><rect width="1200" height="450" fill="#f8fafc" stroke="none"/><text x="55" y="55" class="h">Respondent access and continuity</text><g text-anchor="middle"><rect x="60" y="120" width="350" height="190" fill="#e0f2fe" stroke="#0284c7"/><text x="235" y="165" class="b">Survey reachability</text><text x="235" y="210" class="s">published version + response store</text><text x="235" y="242" class="s">visibility, entry method, link state</text><text x="235" y="279" class="s">May this request reach the survey?</text><rect x="790" y="120" width="350" height="190" fill="#ede9fe" stroke="#7c3aed"/><text x="965" y="165" class="b">Respondent continuity</text><text x="965" y="210" class="s">assigned participant or identity</text><text x="965" y="242" class="s">recognition token or anonymous subject</text><text x="965" y="279" class="s">Which subject represents them?</text><rect x="450" y="175" width="300" height="80" fill="#dcfce7" stroke="#16a34a"/><text x="600" y="210" class="b">Validated access</text><text x="600" y="235" class="s">and resolved subject</text><rect x="450" y="350" width="300" height="60" fill="#fef3c7" stroke="#d97706"/><text x="600" y="387" class="b">Submission session</text></g><path d="M410 215H450M790 215H750M600 255V350" class="x" fill="none"/></svg>
