<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">Response encryption and storage boundary</title><desc id="d">Core metadata and encrypted response data are in separate stores. KMS-wrapped survey keys wrap per-session keys, which encrypt answer values.</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.b{font-size:19px;font-weight:700}.s{font-size:14px;fill:#46536b}.x{stroke:#53647f;stroke-width:3;marker-end:url(#a)}rect{stroke-width:2;rx:15}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53647f"/></marker></defs><rect width="1200" height="470" fill="#f8fafc" stroke="none"/><text x="55" y="55" class="h">Response encryption and storage boundary</text><g text-anchor="middle"><rect x="60" y="105" width="380" height="300" fill="#e0e7ff" stroke="#4f46e5"/><text x="250" y="145" class="b">Core store</text><text x="250" y="185" class="s">identity, survey, session, answer slots</text><rect x="125" y="245" width="250" height="75" fill="#fef3c7" stroke="#d97706"/><text x="250" y="278" class="b">Wrapped survey key</text><text x="250" y="301" class="s">KMS metadata</text><rect x="760" y="105" width="380" height="300" fill="#fce7f3" stroke="#db2777"/><text x="950" y="145" class="b">Response store</text><text x="950" y="185" class="s">opaque response envelope</text><rect x="825" y="230" width="250" height="75" fill="#fef3c7" stroke="#d97706"/><text x="950" y="263" class="b">Wrapped session key</text><text x="950" y="286" class="s">one key per session</text><rect x="825" y="330" width="250" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="950" y="362" class="b">AES-GCM answer rows</text><rect x="495" y="220" width="210" height="90" fill="#fff" stroke="#53647f"/><text x="600" y="255" class="b">Trusted backend</text><text x="600" y="280" class="s">derived locators + key cache</text></g><path d="M375 282H495M705 265H825M950 305V330" class="x" fill="none"/></svg>
