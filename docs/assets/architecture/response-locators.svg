<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="t d"><title id="t">Derived opaque response locators</title><desc id="d">A versioned linkage key derives a response-envelope locator from a core session ID and an encrypted-answer locator from a core answer-slot ID.</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.b{font-size:17px;font-weight:700}.s{font-size:14px;fill:#46536b}.x{stroke:#53647f;stroke-width:3;marker-end:url(#a)}rect{stroke-width:2;rx:14}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53647f"/></marker></defs><rect width="1100" height="320" fill="#f8fafc" stroke="none"/><text x="50" y="52" class="h">Deterministic opaque locator derivation</text><g text-anchor="middle"><rect x="55" y="100" width="210" height="65" fill="#e0e7ff" stroke="#4f46e5"/><text x="160" y="139" class="b">Core session ID</text><rect x="55" y="215" width="210" height="65" fill="#e0e7ff" stroke="#4f46e5"/><text x="160" y="254" class="b">Core answer-slot ID</text><rect x="390" y="152" width="265" height="76" fill="#fef3c7" stroke="#d97706"/><text x="522" y="185" class="b">Versioned linkage key</text><text x="522" y="208" class="s">key version retained by session</text><rect x="780" y="100" width="265" height="65" fill="#fce7f3" stroke="#db2777"/><text x="912" y="139" class="b">Response-envelope locator</text><rect x="780" y="215" width="265" height="65" fill="#fce7f3" stroke="#db2777"/><text x="912" y="254" class="b">Encrypted-answer locator</text></g><g class="x" fill="none"><path d="M265 132H390"/><path d="M265 247H335V190H390"/><path d="M655 180H720V132H780"/><path d="M655 200H720V247H780"/></g></svg>
