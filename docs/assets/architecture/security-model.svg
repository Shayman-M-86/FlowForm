<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t d"><title id="t">FlowForm security model</title><desc id="d">Operator and respondent access take separate paths through a trusted backend, which accesses core metadata and encrypted response stores.</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:25px;font-weight:700}.b{font-size:18px;font-weight:700}.s{font-size:14px;fill:#46536b}.x{stroke:#53647f;stroke-width:3;marker-end:url(#a)}rect{stroke-width:2;rx:14}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53647f"/></marker></defs><rect width="1200" height="450" fill="#f8fafc" stroke="none"/><text x="55" y="55" class="h">Security model: distinct access paths</text><g text-anchor="middle"><rect x="60" y="115" width="210" height="75" fill="#ede9fe" stroke="#7c3aed"/><text x="165" y="147" class="b">Operator browser</text><text x="165" y="171" class="s">Auth0 bearer token</text><rect x="60" y="280" width="210" height="75" fill="#e0f2fe" stroke="#0284c7"/><text x="165" y="312" class="b">Respondent browser</text><text x="165" y="336" class="s">link and scoped cookies</text><rect x="390" y="115" width="240" height="75" fill="#fef3c7" stroke="#d97706"/><text x="510" y="147" class="b">Authentication</text><text x="510" y="171" class="s">external identity validation</text><rect x="390" y="280" width="240" height="75" fill="#dcfce7" stroke="#16a34a"/><text x="510" y="312" class="b">Submission policy</text><text x="510" y="336" class="s">entry, subject, session checks</text><rect x="755" y="175" width="210" height="100" fill="#fee2e2" stroke="#dc2626"/><text x="860" y="215" class="b">Trusted backend</text><text x="860" y="240" class="s">local authorization</text><rect x="1035" y="110" width="125" height="65" fill="#e0e7ff" stroke="#4f46e5"/><text x="1097" y="140" class="b">Core</text><text x="1097" y="161" class="s">metadata</text><rect x="1035" y="290" width="125" height="65" fill="#fce7f3" stroke="#db2777"/><text x="1097" y="320" class="b">Response</text><text x="1097" y="341" class="s">encrypted</text></g><path d="M270 152H390M270 317H390M630 152H700V225H755M630 317H700V240H755M965 215H1000V142H1035M965 235H1000V322H1035" class="x" fill="none"/></svg>
