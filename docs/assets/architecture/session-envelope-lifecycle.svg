<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Session and envelope lifecycle</title><desc id="d">Resolved access and subject prepare core work, commit the response envelope, then commit core work before browser credentials are returned.</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.b{font-size:16px;font-weight:700}.s{font-size:13px;fill:#46536b}.x{stroke:#53647f;stroke-width:3;marker-end:url(#a)}rect{stroke-width:2;rx:14}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53647f"/></marker></defs><rect width="1200" height="300" fill="#f8fafc" stroke="none"/><text x="45" y="52" class="h">Session creation orders two durable stores without a distributed transaction</text><g text-anchor="middle"><rect x="45" y="125" width="185" height="80" fill="#e0f2fe" stroke="#0284c7"/><text x="137" y="158" class="b">Resolved access</text><text x="137" y="181" class="s">+ final subject</text><rect x="275" y="125" width="185" height="80" fill="#e0e7ff" stroke="#4f46e5"/><text x="367" y="158" class="b">Prepare Core work</text><text x="367" y="181" class="s">not yet committed</text><rect x="505" y="125" width="185" height="80" fill="#fce7f3" stroke="#db2777"/><text x="597" y="158" class="b">Commit Response</text><text x="597" y="181" class="s">envelope + wrapped key</text><rect x="735" y="125" width="185" height="80" fill="#e0e7ff" stroke="#4f46e5"/><text x="827" y="158" class="b">Commit Core</text><text x="827" y="181" class="s">session + side effects</text><rect x="965" y="125" width="185" height="80" fill="#dcfce7" stroke="#16a34a"/><text x="1057" y="158" class="b">Return credentials</text><text x="1057" y="181" class="s">resume/recognition tokens</text></g><g class="x" fill="none"><path d="M230 165H275"/><path d="M460 165H505"/><path d="M690 165H735"/><path d="M920 165H965"/></g></svg>
