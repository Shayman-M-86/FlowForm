packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# Exact-version exemptions for security fixes younger than the gate. Remove
# each entry once it ages past 7 days.
minimumReleaseAgeExclude:
  - fast-uri@3.1.9 # GHSA-333x-w4r6-6crp et al.; published 2026-10-20, remove after 2026-10-27

onlyBuiltDependencies:
  - browser-tabs-lock
  - esbuild
  - sharp

overrides:
  # Security floors for transitive deps (see `pnpm audit`). Ranges, not exact
  # pins, so patch releases flow in instead of freezing an old version.
  "brace-expansion@^1": ^1.1.21
  "brace-expansion@^2": ^2.1.7
  "brace-expansion@^5": ^5.0.12
  compression: ^1.8.2
  devalue: ^5.9.4
  esbuild: 0.28.1
  fast-uri: ^3.1.9
  http-cache-semantics: ^4.3.0
  js-yaml: ^4.3.2
  "nanoid@^3": ^3.3.18
  postcss: ^8.5.23
  postcss-selector-parser: ^7.1.6
  seroval: ^1.6.3
  sharp: ^0.35.5
  smol-toml: ^1.9.0
  source-map-js: ^1.2.2
  svgo: ^4.1.0
  undici: ^7.30.1
  "zod@^4": ^4.6.6
