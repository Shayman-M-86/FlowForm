[project]
name = "flowform-tools"
version = "0.1.0"
description = "FlowForm repository tooling — documentation system, OpenAPI MCP server, and agent hooks"
requires-python = ">=3.14"
# Intentionally empty. `flowform_tools.docsys` and `flowform_tools.agent_hooks`
# bare `python3` with no virtual environment and no install step. Commands that
# use richer validation run through optional extras; MCP dependencies belong in
# the separate `openapi` and `research` extras.
dependencies = []

[project.optional-dependencies]
docs = [
    "pydantic>=2",
]
research = [
    "claude-agent-sdk>=0.2.111",
    "fastmcp>=3.3.1",
    "pydantic>=2",
]
openapi = [
    "cryptography>=48.0.1",
    "fastmcp>=3.3.1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowform_tools"]

[tool.hatch.build.targets.wheel.force-include]
"flowform_tools/docsys/prompts" = "flowform_tools/docsys/prompts"

[tool.pyright]
extends = "../pyrightconfig.json"
include = [
    "flowform_tools",
    "tests",
]
exclude = [
    "**/__pycache__",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "**/.*",
]
venvPath = "."
venv = ".venv"

[tool.uv]
package = true
constraint-dependencies = [
    "joserfc>=1.6.8",
    "mcp>=1.28.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]
